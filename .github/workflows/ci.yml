name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Tests
        run: pytest -q
      - name: Migration check (fresh DB)
        run: |
          python -m stock_alert_app.migrate upgrade
          python -m stock_alert_app.migrate status
        env:
          STOCK_ALERT_DB: /tmp/ci-fresh.db

  api-smoke:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx
      - name: API checks (health, ready, critical endpoints)
        run: |
          python -m uvicorn stock_alert_app.web_app:app --host 127.0.0.1 --port 8123 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8123/api/health/ready
          curl -sf "http://127.0.0.1:8123/api/markets" > /dev/null
          curl -sf "http://127.0.0.1:8123/api/health/data" > /dev/null
          curl -sf "http://127.0.0.1:8123/api/analytics/committee" > /dev/null
          echo "API smoke OK"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Production Vite build
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  worker-smoke:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Worker single cycle
        run: python -m stock_alert_app.worker --once
        env:
          STOCK_ALERT_DB: /tmp/ci-worker.db
          STOCK_ALERT_REFRESH_FAST: "30"
