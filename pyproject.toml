[project]
name = "stock-alert-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "yfinance>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "torch>=2.4",
    "transformers>=4.40",
    "google-genai>=2.17.0",
    "python-dotenv>=1.2.2",
    "praw>=8.0.2",
]

[project.scripts]
stock-alert-app = "stock_alert_app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
